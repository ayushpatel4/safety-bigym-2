# @package _global_
# COWORKER training distribution — moderate band on every continuous knob.
#
# Pair with the eval preset coworker_eval.yaml for narrow-train /
# wider-eval generalisation experiments. The eval preset is a strict
# superset on every axis, so eval rollouts probe both in-distribution
# and out-of-distribution conditions.
#
# Hydra usage (group name singular, matches bodyslam=...):
#   python train_safety.py ... disruption=coworker_train
#
# `env.disruption_type=COWORKER` forces every episode to COWORKER via the
# factory's `forced` branch (safety_bigym_factory.py:211-221), overriding
# whatever weights were merged in from env/safety_bigym.yaml. The
# coworker_*_range fields tighten the five continuous knobs to the train
# band.
#
# Knobs:
#   1. closest_approach   - body distance from robot at NEAR (m)
#   2. reach_period       - seconds per reach cycle (1 / frequency)
#   3. target_mix_p_ee    - P(reach robot EE); P(task object) = 1 - p
#   4. near_loiter        - per-visit dwell at NEAR (s)
#   5. walk_speed         - walking speed (m/s)

env:
  disruption_type: COWORKER
  disruptions:
    # Tightened 2026-05-27: human body within 0.55–0.85 m of the robot
    # base so the active arm's reach phase reliably puts the wrist inside
    # the robot's manipulation envelope (forces ssm/proximity violations
    # and arm-to-robot contacts during HOLD).
    #
    # Reach geometry. ``CoworkerArmController._max_reach_dist = 0.75 m``
    # is the shoulder→target gate. Shoulder lateral offset from pelvis
    # is ~0.15 m (SMPL-H) and ~0.1 m (G1); robot EE typically sits
    # ~0.5 m forward of the robot pelvis. So body distance ≲ 0.85 m is
    # required for shoulder→EE to clear 0.75 m from most approach angles,
    # and ≲ 0.65 m puts the wrist reliably <0.5 m from EE during HOLD
    # (proximity_violation at τ=0.5 m, frequent ssm_violation_actual).
    # The 0.55 m floor keeps the mocap-driven human pelvis capsule clear
    # of the robot's pelvis collision geom (~0.25 m of body-surface
    # clearance) so it doesn't geometrically penetrate the robot — the
    # mocap can't be pushed back, penetration produces enormous spurious
    # forces. These knobs apply identically to SMPL-H and G1 (both go
    # through the same CoworkerArmController + ScenarioSampler).
    coworker_closest_approach_range: [0.55, 0.85]
    # Fast reach cycles — full extend+retract in ~1 s at the low end.
    coworker_reach_period_range: [0.9, 1.6]
    # Mostly target the robot EE (was 0.4–0.6).
    coworker_target_mix_p_ee_range: [0.55, 0.85]
    # Longer dwell at closest_approach (was 7–11 s).
    coworker_near_loiter_range: [12.0, 18.0]
    coworker_walk_speed_range: [1.2, 1.7]
    # Patrol dominates (~80%) so training mostly sees depart/return cycles
    # (robot gets windows to work when the human walks AWAY).
    coworker_trajectory_weights:
      COWORKER_PATROL: 10
      APPROACH_LOITER_DEPART: 0
      STATIONARY: 0
