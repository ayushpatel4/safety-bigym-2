# @package _global_
# Base config for SafetyBiGym environments
# Extends bigym with human/safety configuration

env:
  env_name: safety_bigym
  episode_length: 3000
  cameras: ["head", "right_wrist", "left_wrist"]
  action_mode: absolute
  floating: true
  dataset_root: ""
  demo_down_sample_rate: 20
  render_mode: rgb_array
  enable_all_floating_dof: false

  # Safety-specific settings
  inject_human: true
  # Which humanoid plays the coworker role. "g1" (default) uses the Unitree G1
  # standing-pose mannequin with procedural arm IK; "smplh" uses SMPL-H + AMASS
  # (or procedural when env.smplh_motion=procedural).
  human_model: g1
  # SMPL-H motion: "amass" (default) replays CMU clips on the body;
  # "procedural" holds a fixed standing pose and moves the pelvis via the
  # trajectory planner (same contract as G1 — no AMASS, no AMASS_DATA_DIR).
  smplh_motion: amass
  motion_clip_dir: ${oc.env:AMASS_DATA_DIR,null}
  motion_clip_paths:
    - "74/74_01_poses.npz"
    - "74/74_02_poses.npz"
    - "09/09_01_poses.npz"
    - "09/09_03_poses.npz"
    - "122/122_04_poses.npz"

  # Disruption sampling. Tuned to put a meaningful fraction of episodes
  # into the SSM/PFL violation regime via passive intrusion (OBSTRUCTION:
  # human plants in workspace) and active reach (CONTACT: human walks into
  # and presses on the robot). All types loiter then depart so the robot
  # can recover and finish its task.
  # Per-step reward shaping for safety violations. Default off — opt in
  # per-launch (e.g. drqv2plus_pixel_safety_bigym for Phase-1.4). BC
  # methods (ACT/DP) ignore env reward as a learning signal, so this only
  # bites under online RL.
  safety:
    add_violation_penalty: false
    violation_penalty: 0.05
    # E3.1 cost-signal form for the Phase 3 Lagrangian cost c_t (env_adapter):
    #   continuous (default, headline) = graded compute_cost in [0,1]
    #   binary                         = 1[ssm_violation]
    # The `fixed` E3.1 cell is NOT a cost form — it sets add_violation_penalty=true
    # (reward penalty) under plain agent=cqn_as with the Lagrangian disabled.
    cost_form: continuous
    # P3.0a workspace reward shaping. Penalises the EE for drifting outside a
    # radius around the task-relevant object — counters the C2 evacuation mode
    # where the agent learns to flee the human because the violation penalty
    # is the only signal. Off by default; opt in per-launch (e.g. Phase 3
    # validation / P3.1 training). Defaults mirror SafetyConfig.
    # `workspace_excess_cap` bounds the per-step penalty at -beta*cap so the
    # discounted return stays inside the critic's value support (an unbounded
    # dense penalty saturates the C51 target clamp — the 2026-05-20 base-
    # validation failure; see docs/phase3_base_validation_findings.md).
    # Invariant: beta * workspace_excess_cap / (1 - gamma) <= |agent.v_min|.
    add_workspace_penalty: false
    workspace_radius: 0.4
    workspace_beta: 0.05
    workspace_excess_cap: 1.0

  disruptions:
    weights:
      INCIDENTAL: 0.15
      SHARED_GOAL: 0.15
      DIRECT: 0.20
      OBSTRUCTION: 0.20
      RANDOM_PERTURBED: 0.10
      CONTACT: 0.20
    closest_approach_range: [0.0, 0.8]
    pass_by_offset_range: [0.05, 1.2]
    loiter_duration_range: [4.0, 10.0]
    embed_distance_range: [0.0, 0.05]
    walk_speed_range: [1.0, 2.0]
    spawn_distance_range: [0.8, 1.8]
    arc_radius_range: [0.5, 1.8]

demos: !!float .inf
