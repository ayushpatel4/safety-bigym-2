# @package _global_
# COWORKER evaluation distribution — wider band on every continuous knob.
#
# Strict superset of coworker_train.yaml on all five axes, so eval
# episodes cover both in-distribution and out-of-distribution
# conditions. Use this for the held-out evaluation step of the
# narrow-train / wider-eval generalisation experiment.
#
# Hydra usage (group name singular, matches bodyslam=...):
#   python train_safety.py ... disruption=coworker_eval
#
# `env.disruption_type=COWORKER` forces every episode to COWORKER via the
# factory's `forced` branch (safety_bigym_factory.py:211-221), overriding
# whatever weights were merged in from env/safety_bigym.yaml.

env:
  disruption_type: COWORKER
  disruptions:
    # Closer + further than train (train: 0.9-1.4).
    coworker_closest_approach_range: [0.6, 1.8]
    # ~2x more / less frequent than train (train: 4.5-6.5).
    coworker_reach_period_range: [3.0, 9.0]
    # Near-pure EE preference + near-pure task preference (train: 0.4-0.6).
    coworker_target_mix_p_ee_range: [0.1, 0.9]
    # Short + long dwells (train: 7-11).
    coworker_near_loiter_range: [4.0, 16.0]
    # Shuffle + brisk walk (train: 0.8-1.3 after 2026-05-26 slowdown).
    # Slowed ~25 % from [0.6, 2.2] to keep the eval band a strict superset
    # of the new train band while preserving the wide spread for OOD probe.
    coworker_walk_speed_range: [0.5, 1.7]
