# @package _global_
# Base config for SafetyBiGym environments
# Extends bigym with human/safety configuration

env:
  env_name: safety_bigym
  episode_length: 3000
  cameras: ["head", "right_wrist", "left_wrist"]
  action_mode: absolute
  floating: true
  dataset_root: ""
  demo_down_sample_rate: 20
  render_mode: rgb_array
  enable_all_floating_dof: false

  # Safety-specific settings
  inject_human: true
  motion_clip_dir: ${oc.env:AMASS_DATA_DIR,null}
  motion_clip_paths:
    - "74/74_01_poses.npz"
    - "74/74_02_poses.npz"
    - "09/09_01_poses.npz"
    - "09/09_03_poses.npz"
    - "122/122_04_poses.npz"

  # Disruption sampling. Tuned to put ~60% of episodes into a meaningful
  # SSM/PFL violation regime, split between passive intrusion (OBSTRUCTION:
  # human plants in workspace, robot drives into them) and active reach
  # (CONTACT: human walks into and presses on the robot).
  disruptions:
    weights:
      INCIDENTAL: 0.15
      SHARED_GOAL: 0.15
      DIRECT: 0.20
      OBSTRUCTION: 0.20
      RANDOM_PERTURBED: 0.10
      CONTACT: 0.20
    closest_approach_range: [0.0, 0.8]
    pass_by_offset_range: [0.05, 1.2]
    loiter_duration_range: [3.0, 10.0]
    embed_distance_range: [0.0, 0.05]
    walk_speed_range: [1.0, 2.0]
    spawn_distance_range: [0.8, 1.8]
    arc_radius_range: [0.5, 1.8]

demos: !!float .inf
