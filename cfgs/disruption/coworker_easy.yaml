# @package _global_
# COWORKER *gentle* distribution — stage 1 of the base-policy human curriculum.
#
# The human stays farther away, reaches less often, and targets the robot EE
# rarely, so a policy that already knows the task (curriculum stage 0, no human)
# can adapt to a present-but-mild coworker before facing the full coworker_train
# band (stage 2). Used by scripts/run_base_curriculum.sh via snapshot-resume.
# See docs/phase3_base_validation_findings.md (the train/demo distribution
# mismatch this curriculum is designed to soften).
#
# Hydra usage:
#   python train_cqn_as.py ... disruption=coworker_easy
#
# Every knob is gentler than coworker_train.yaml (which it is the easy end of):
#   1. closest_approach   - farther (less SSM pressure)
#   2. reach_period       - longer (reaches less frequently)
#   3. target_mix_p_ee    - lower P(reach robot EE)
#   4. near_loiter        - shorter dwell near the robot
#   5. walk_speed         - slower

env:
  disruption_type: COWORKER
  disruptions:
    coworker_closest_approach_range: [1.8, 2.5]
    coworker_reach_period_range: [8.0, 11.0]
    coworker_target_mix_p_ee_range: [0.1, 0.25]
    coworker_near_loiter_range: [3.0, 5.0]
    # walk_speed slowed ~25 % from [0.7, 1.1] on 2026-05-26 to give the
    # CQN-AS actor more room to react under shaping. See
    # docs/IMPLEMENTATION_STATUS "SSM-semantics change" note.
    coworker_walk_speed_range: [0.5, 0.9]
