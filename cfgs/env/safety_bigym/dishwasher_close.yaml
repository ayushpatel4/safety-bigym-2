# @package _global_

defaults:
  - safety_bigym
  - _self_

env:
  task_name: dishwasher_close
  stddev_schedule: linear(1.0,0.1,500000)
  episode_length: 7000
  demo_down_sample_rate: 20
  enable_all_floating_dof: true
  safety:
    # dishwasher_close success = all joints (door, trays) -> 0 (closed), so the
    # rung-3 progress potential targets 0. Enable shaping per-launch with
    # env.safety.add_progress_reward=true.
    progress_goal: 0.0

# Per-task override: DemoStore has 69 demos; 50 is a safe default above the 30 used
# for the original training run.
demos: 50
